name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install release tooling
        run: python -m pip install -e '.[dev,release]'
      - name: Install frontend harness and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m playwright install chromium
      - name: Start loopback CDP browser
        run: |
          chrome_path="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          "$chrome_path" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/hermes-chrome-cdp" \
            --no-first-run \
            --no-default-browser-check \
            about:blank >/tmp/hermes-chrome-cdp.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          python -c 'from pathlib import Path; print(Path("/tmp/hermes-chrome-cdp.log").read_text())'
          exit 1
      - name: Run release tests
        run: |
          python -m pytest tests/ -q -o 'addopts='
          npm test
      - name: Build and validate artifacts
        run: |
          python -m build --sdist --wheel
          python scripts/release_check.py
          python -m twine check dist/*
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
