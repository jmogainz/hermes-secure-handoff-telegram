name: telegram-secure-handoff
version: 2.1.0
manifest_version: 1
api_version: 1
kind: standalone
description: >
  Transport-only encrypted Telegram Mini App bridge that applies agent-selected
  operations to exact controls in the dedicated local Hermes Chrome profile.
author: Hermes Secure Handoff Telegram contributors
license: MIT
python_dependencies:
  - "cryptography>=42,<51"
  - "playwright>=1.58,<2"
  - "python-telegram-bot>=21,<23"
config_schema:
  mini_app_url:
    type: str
    required: false
    default: "https://hermessecurehandoff.xyz"
    description: "HTTPS origin hosting the Telegram Mini App; the official shared URL is the default"
  allowed_user_ids:
    type: list
    required: true
    description: "Exactly one positive numeric Telegram owner ID for this Hermes/Chrome profile"
  browser_cdp_url:
    type: str
    default: "http://127.0.0.1:9222"
    description: "Loopback HTTP Chrome DevTools endpoint; remote and websocket endpoints are rejected"
tags:
  - telegram
  - browser
  - authentication
  - mini-app
provides_tools:
  - telegram_secure_handoff
