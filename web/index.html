<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Hermes Secure Handoff Telegram</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="app-card" aria-labelledby="page-title" data-state="loading">
        <p class="status-kicker sr-only" id="status-kicker" aria-live="polite">Preparing secure check</p>
        <h1 id="page-title">Check your Telegram connection</h1>

        <form class="credential-form" id="credential-form" autocomplete="on" novalidate>
          <div class="secure-details" id="secure-details" hidden>
            <p class="origin-line"><span>Target</span> <strong id="request-origin"></strong></p>
            <div class="field-list" id="field-list"></div>
          </div>
          <button class="send-button" id="send-button" type="submit" hidden>
            <span>Send test</span>
          </button>
        </form>

        <p class="status-message" id="status-message" aria-live="polite">Loading the one-time connection test.</p>
      </section>
    </main>

    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
